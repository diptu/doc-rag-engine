version: '3.8'

services:
  rag-engine:
    build: .
    container_name: doc-rag-app
    ports:
      - "8000:8000" # Host 8000 -> Container 8000 (MkDocs)
      - "8001:8001" # Host 8001 -> Container 8001 (API)
    env_file:
      - .env
    volumes:
      # Persist your feedback logs and uploaded documents
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      - ENV=production
      - api_key=${api_key}
    restart: always

  # If you use MongoDB for the MERN parts of your project:
  db:
    image: mongo:latest
    container_name: rag-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: